name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: el-yy
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=B87355&color_dots=#2B2520,#596B55,#83966F,#B87355,#E2B879

      - name: Commit generated snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "github-contribution-grid-snake.svg"
